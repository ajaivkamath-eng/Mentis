name: ci
on:
  push:
    branches: [main, arena/**]
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
        working-directory: apps/mobile
      - run: npm run typecheck
        working-directory: apps/mobile

  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - run: deno check supabase/functions/send-email/index.ts supabase/functions/taster-form/index.ts supabase/functions/diary-public/index.ts supabase/functions/member-microflow/index.ts supabase/functions/breach-eval/index.ts supabase/functions/monthly-summary/index.ts supabase/functions/task-reminders/index.ts
